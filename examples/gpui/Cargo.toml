[package]
name = "frame-capture-example-gpui"
version = "0.2.1"
description = "GPUI enum route-only integration example for frame-capture."
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.98"

[features]
default = ["capture"]
# Native headless rendering needs a GPUI release that ships the platform
# headless renderer. Upstream gpui-pre does not expose one yet, so keep the
# capture path behind a feature until the pinned release provides it.
capture = ["dep:gpui_wgpu", "gpui-kit/test-support"]

[dependencies]
gpui-kit = "0.6.4"
gpui_wgpu = { optional = true, package = "gpui-pre-wgpu", features = [
  "font-kit",
], version = "=0.3.5" }
image = { default-features = false, features = ["png"], version = "0.25.10" }

frame-capture-routes = { default-features = false, features = [
  "macros",
], path = "../../crates/frame-capture-routes" }
