[package]
name = "frame-capture-example-gpui"
version = "0.1.0"
description = "GPUI enum route-only integration example for frame-capture."
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.95"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "c545fb67d0ce13e335bff76f7c08986000333f2c" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui_wgpu = { features = [
  "font-kit",
], git = "https://github.com/zed-industries/zed", rev = "c545fb67d0ce13e335bff76f7c08986000333f2c" }
image = { default-features = false, features = [ "png" ], version = "0.25.5" }

gpui_platform = { features = [
  "font-kit",
  "x11",
  "wayland",
  "test-support",
  "runtime_shaders",
], git = "https://github.com/zed-industries/zed", rev = "c545fb67d0ce13e335bff76f7c08986000333f2c" }
frame-capture-routes = { default-features = false, features = [
  "macros",
], path = "../../crates/frame-capture-routes" }

[replace]
"https://github.com/zed-industries/zed#gpui@0.2.2" = { git = "https://github.com/zed-industries/zed", rev = "c545fb67d0ce13e335bff76f7c08986000333f2c" }
"https://github.com/zed-industries/zed#gpui_macros@0.1.0" = { git = "https://github.com/zed-industries/zed", rev = "c545fb67d0ce13e335bff76f7c08986000333f2c" }
