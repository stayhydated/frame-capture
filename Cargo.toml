[workspace]
exclude = [ "examples/gpui" ]
members = [
  "crates/frame-capture",
  "crates/frame-capture-bevy",
  "crates/frame-capture-macros",
  "crates/frame-capture-mcp",
  "crates/frame-capture-routes",
  "crates/frame-capture-routes-bevy",
  "crates/frame-capture-toml",
  "examples/bevy",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stayhydated/frame-capture"
rust-version = "1.99"
version = "0.2.4"

[workspace.dependencies]
anyhow = "1.0.104"
bevy = { default-features = false, version = "0.20.0" }
bevy_app = { default-features = false, version = "0.20.0" }
bon = "3.10.3"
clap = "4.6.7"
darling = "0.24.1"
derive_more = { default-features = false, features = [
  "as_ref",
  "deref",
  "display",
  "from",
], version = "2.1.1" }
dioxus = { default-features = false, version = "0.7.10" }
frame-capture = { default-features = false, path = "crates/frame-capture", version = "0.2.4" }
frame-capture-bevy = { path = "crates/frame-capture-bevy", version = "0.2.4" }
frame-capture-macros = { path = "crates/frame-capture-macros", version = "0.2.4" }
frame-capture-mcp = { path = "crates/frame-capture-mcp", version = "0.2.4" }
frame-capture-routes = { default-features = false, path = "crates/frame-capture-routes", version = "0.2.4" }
frame-capture-routes-bevy = { path = "crates/frame-capture-routes-bevy", version = "0.2.4" }
frame-capture-toml = { path = "crates/frame-capture-toml", version = "0.2.4" }
fs-err = "3.3.2"
heck = "0.5.0"
image = { default-features = false, features = [ "png" ], version = "0.25.10" }
inventory = "0.3.25"
koruma = { default-features = false, version = "0.13.1" }
proc-macro2 = "1.0.107"
quote = "1.0.47"
rmcp = { default-features = false, features = [
  "macros",
  "server",
  "transport-io",
], version = "3.7.0" }
schemars = "1.2.3"
serde = { features = [ "derive" ], version = "1.0.229" }
serde_json = "1.0.154"
serde_with = { default-features = false, features = [ "macros" ], version = "3.24.0" }
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "b3f91071b4e61702a63f57844560f70bbc9bf623" }
syn = "3.0.9"
thiserror = "2.0.21"
toml = "1.1.8"
web = { path = "web" }
web-sys = { features = [ "Location", "Window" ], version = "0.3.106" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
