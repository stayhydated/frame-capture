[package]
name = "frame-capture-example-gpui"
version = "0.1.0"
description = "GPUI enum route-only integration example for frame-capture."
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.98"

[dependencies]
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "0.2.2" }
gpui-component = { git = "https://github.com/stayhydated/gpui-component", rev = "fc7ea7a1a56daa54cfe48b0bcb688493eaff198b" }
gpui_wgpu = { branch = "linux-headless-renderer", features = [
  "font-kit",
], git = "https://github.com/stayhydated/zed" }
image = { default-features = false, features = [ "png" ], version = "0.25.10" }

frame-capture-routes = { default-features = false, features = [
  "macros",
], path = "../../crates/frame-capture-routes" }
gpui_platform = { branch = "linux-headless-renderer", features = [
  "font-kit",
  "x11",
  "wayland",
  "test-support",
  "runtime_shaders",
], git = "https://github.com/stayhydated/zed" }

[patch."https://github.com/zed-industries/zed"]
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "=0.2.2" }
gpui_macros = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "0.1.0" }
