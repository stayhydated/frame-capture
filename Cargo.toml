[workspace]
exclude = [ "examples/gpui" ]
members = [
  "crates/frame-capture",
  "crates/frame-capture-bevy",
  "crates/frame-capture-macros",
  "crates/frame-capture-mcp",
  "crates/frame-capture-routes",
  "crates/frame-capture-routes-bevy",
  "crates/frame-capture-toml",
  "examples/bevy",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
bevy = { default-features = false, version = "0.19" }
bevy_app = { default-features = false, version = "0.19" }
bon = "3.9"
clap = "4.6"
darling = "0.23"
derive_more = { default-features = false, features = [
  "as_ref",
  "deref",
  "display",
  "from",
], version = "2.1" }
dioxus = { default-features = false, version = "0.7" }
frame-capture = { default-features = false, path = "crates/frame-capture" }
frame-capture-bevy = { path = "crates/frame-capture-bevy" }
frame-capture-macros = { path = "crates/frame-capture-macros" }
frame-capture-mcp = { path = "crates/frame-capture-mcp" }
frame-capture-routes = { default-features = false, path = "crates/frame-capture-routes" }
frame-capture-routes-bevy = { path = "crates/frame-capture-routes-bevy" }
frame-capture-toml = { path = "crates/frame-capture-toml" }
fs-err = "3.3"
heck = "0.5"
image = { default-features = false, features = [ "png" ], version = "0.25" }
inventory = "0.3"
koruma = { default-features = false, version = "0.10" }
proc-macro2 = "1.0"
quote = "1.0"
rmcp = { default-features = false, features = [
  "macros",
  "server",
  "transport-io",
], version = "3.0" }
schemars = "1.2"
serde = { features = [ "derive" ], version = "1.0" }
serde_json = "1.0"
serde_with = { default-features = false, features = [ "macros" ], version = "3.21" }
stayhydated-dioxus = { path = "../shared/crates/stayhydated-dioxus" }
stayhydated-site = { path = "../shared/crates/stayhydated-site" }
stayhydated-xtask = { path = "../shared/crates/stayhydated-xtask" }
syn = "2.0"
thiserror = "2.0"
toml = "0.9"
web = { path = "web" }
web-sys = { features = [ "Location", "Window" ], version = "0.3" }

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"
