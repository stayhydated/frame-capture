name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: stayhydated/shared/.github/workflows/deploy-pages-compat.yml@c6c6f2298fab7681ee4200343d881fdbd614259a
    with:
      build-command: |
        cargo run --locked -p xtask -- build book
        cargo run --locked -p xtask -- build llms-txt
        cargo run --locked -p xtask -- build web
