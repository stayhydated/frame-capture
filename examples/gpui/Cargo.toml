[package]
name = "frame-capture-example-gpui"
version = "0.1.0"
description = "GPUI router route-only integration example for frame-capture."
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.95"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "b077f41a9f26ae5ed7fadfea55a501d34afb25de" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-router = { path = "../../../gpui-router/crates/router" }
gpui_wgpu = { features = [
  "font-kit",
], git = "https://github.com/zed-industries/zed", rev = "b077f41a9f26ae5ed7fadfea55a501d34afb25de" }
image = { default-features = false, features = [ "png" ], version = "0.25.5" }

gpui_platform = { features = [
  "font-kit",
  "x11",
  "wayland",
  "test-support",
  "runtime_shaders",
], git = "https://github.com/zed-industries/zed", rev = "b077f41a9f26ae5ed7fadfea55a501d34afb25de" }
frame-capture-routes = { default-features = false, features = [
  "macros",
], path = "../../crates/frame-capture-routes" }

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../../../zed/crates/gpui" }
gpui_platform = { path = "../../../zed/crates/gpui_platform" }
gpui_wgpu = { path = "../../../zed/crates/gpui_wgpu" }
