name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps

      - name: Run all-target tests
        run: cargo test --workspace --all-features --all-targets --locked

      - name: Run doctests
        run: cargo test --workspace --all-features --doc --locked

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path examples/gpui/Cargo.toml --all -- --check

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Check code
        run: cargo check --workspace --all-features --all-targets --locked

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Lint code
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Verify packaged release graph
        run: cargo publish --workspace --dry-run --locked

      - name: Check tracked lockfiles for drift
        run: git diff --exit-code -- Cargo.lock ':(glob)**/Cargo.lock'

  machete:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # main
        with:
          version: "1.25.1"
      - name: Install pinned Machete
        run: cargo binstall cargo-machete --version '=0.9.2' --locked --no-confirm
      - name: Check unused dependencies
        run: cargo machete

  rust-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # main
        with:
          version: "1.25.1"

      - name: Install cargo-llvm-cov
        shell: bash
        run: cargo binstall cargo-llvm-cov --version '=0.9.1' --locked --no-confirm

      - name: Run coverage
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --all-targets --no-report --locked
          FRAME_CAPTURE_ROUTE=bevy/dashboard FRAME_CAPTURE_PATH=target/coverage-dashboard.png FRAME_CAPTURE_SCENARIO=alert cargo llvm-cov --no-report run -p frame-capture-example-bevy --locked
          FRAME_CAPTURE_ROUTE=bevy/detail FRAME_CAPTURE_PATH=target/coverage-detail.png FRAME_CAPTURE_FRAME=2 FRAME_CAPTURE_WIDTH=640 FRAME_CAPTURE_HEIGHT=360 cargo llvm-cov --no-report run -p frame-capture-example-bevy --locked
          cargo llvm-cov report --cobertura --output-path=target/cobertura.xml

      - name: Codecov publish
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: target/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov housekeeping
        shell: bash
        run: |
          rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig

  quality:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Taplo and ShellCheck
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: "taplo@0.10.0,shellcheck@0.11.0"
          checksum: true
          fallback: none
      - name: Check TOML formatting
        run: taplo fmt --check
      - name: Check Markdown
        uses: rvben/rumdl@a7a8434abe60f64239ea05624885f9bad66a1026 # action v0.2.79
        with:
          version: "0.2.78"
          command: check
          path: "."
          fail-on-error: "true"
      - name: Prevent checkout-controlled typos executable reuse
        run: test ! -e typos && test ! -L typos
      - name: Check spelling
        uses: crate-ci/typos@06d010dfe4c84fdab1a25ea02b57b3585018ba80 # v1.42.3
        with:
          write_changes: false
      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # main
        with:
          version: "1.25.1"
      - name: Install derive sorter
        run: cargo binstall cargo-sort-derives --version '=0.13.0' --locked --no-confirm
      - name: Check derive order
        run: cargo sort-derives --check
      - name: Check workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12, includes ShellCheck and pyflakes
      - name: Check shell scripts
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 --no-run-if-empty shellcheck

  dependencies:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check dependency advisories and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          rust-version: "stable"
          arguments: "--workspace --all-features --locked"
          command: check
          command-arguments: "advisories sources"

  feature-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Check each library feature selection independently
        run: |
          cargo check -p frame-capture --lib --locked
          cargo check -p frame-capture --lib --locked --no-default-features
          cargo check -p frame-capture --lib --locked --no-default-features --features macros
          cargo check -p frame-capture --lib --locked --no-default-features --features json-schema
          cargo check -p frame-capture-routes --lib --locked --no-default-features
          cargo check -p frame-capture-bevy --lib --locked --no-default-features
          cargo check -p frame-capture-bevy --lib --locked --no-default-features --features registry

  gpui-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libclang-dev libvulkan-dev
      - name: Check excluded GPUI example
        run: cargo check --manifest-path examples/gpui/Cargo.toml --all-targets --locked

  publication-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MDBOOK_BUILD__CREATE_MISSING: "false"
      RUSTC_WRAPPER: ""
      TRUNK_SKIP_VERSION_CHECK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # main
        with:
          version: "1.25.1"
      - name: Install publication tools
        run: cargo binstall dioxus-cli --version '=0.7.9' --locked --no-confirm
      - name: Check the publication dependency lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build publication artifacts
        run: |
          cargo run --locked -p xtask -- build book
          cargo run --locked -p xtask -- build llms-txt
          cargo run --locked -p xtask -- build web
      - name: Check tracked lockfiles for drift
        run: git diff --exit-code -- Cargo.lock ':(glob)**/Cargo.lock'

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, fmt, check, clippy, docs, package, machete, rust-coverage, quality, dependencies, feature-checks, gpui-example]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Publish unpublished crate versions
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        with:
          command: release
          version: 0.3.162
        env:
          GITHUB_TOKEN: ${{ github.token }}
