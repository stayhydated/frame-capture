[package]
name = "frame-capture-bevy"
version = "0.1.0"
description = "Bevy facade for frame-capture offscreen screenshots and route plugins."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = [ "macros" ]
macros = [ "dep:frame-capture-macros" ]
registry = [ "dep:frame-capture-macros", "dep:frame-capture-routes-bevy", "macros" ]

[dependencies]
bevy = { default-features = false, features = [
  "bevy_asset",
  "bevy_render",
  "bevy_state",
  "bevy_window",
  "bevy_winit",
  "png",
  "std",
  "wayland",
  "x11",
], workspace = true }
frame-capture = { default-features = false, workspace = true }
frame-capture-macros = { optional = true, workspace = true }
frame-capture-routes-bevy = { optional = true, workspace = true }
image.workspace = true
thiserror.workspace = true

[lints]
workspace = true
