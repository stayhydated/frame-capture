[package]
name = "frame-capture"
version = "0.2.0"
description = "Target-neutral route and capture-session primitives for Rust application screenshots."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = [ "macros" ]
json-schema = [ "dep:schemars" ]
macros = [ "dep:frame-capture-macros" ]

[dependencies]
bon.workspace = true
derive_more.workspace = true
frame-capture-macros = { optional = true, workspace = true }
frame-capture-toml.workspace = true
koruma.workspace = true
schemars = { optional = true, workspace = true }
serde = { workspace = true }
serde_with.workspace = true
thiserror.workspace = true

[dev-dependencies]
frame-capture-macros.workspace = true
serde_json.workspace = true
trybuild = "1.0"

[lints]
workspace = true
